name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project from index.html
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/status-bar@6
          cat > capacitor.config.json <<'CONFIG'
          {
            "appId": "com.reelmood.app",
            "appName": "Reel Mood",
            "webDir": "www",
            "backgroundColor": "#0a0c11",
            "plugins": {
              "StatusBar": {
                "style": "DARK",
                "backgroundColor": "#0a0c11",
                "overlaysWebView": false
              }
            }
          }
          CONFIG
          npx cap add android
          npx cap sync android
          sed -i 's|@drawable/splash|#0a0c11|' android/app/src/main/res/values/styles.xml || true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../reel-mood.apk

      - uses: actions/upload-artifact@v4
        with:
          name: reel-mood-apk
          path: reel-mood.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Reel Mood build ${{ github.run_number }}
          files: reel-mood.apk
